# P2: prueba de memoria de la limpieza y las features (temporal, en la rama de trabajo)
name: P2 memoria

on:
  push:
    branches: [feat/p2]
    paths:
      - "tc5061_proyecto_equipo07/**"
      - ".github/workflows/p2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memoria:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar los CSV de data/raw
        uses: actions/cache@v4
        with:
          path: data/raw
          key: datos-raw-${{ hashFiles('references/fuentes-datos.csv') }}
      - name: Datos (descarga lo que falte, construye y limpia)
        run: python -m tc5061_proyecto_equipo07.dataset todo
      - name: Limpieza y features de P2 (con memoria máxima)
        run: |
          /usr/bin/time -v python -c "
          from tc5061_proyecto_equipo07 import features as f
          viajes, estaciones = f.p2_cargar_viajes()
          f.p2_construir_caracteristicas(viajes, estaciones)
          " 2>&1 | tee salida.txt
          grep "Maximum resident set size" salida.txt