<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2080 712" width="2080" height="712" role="img" aria-label="Pipeline de ML: una limpieza común se bifurca en tres carriles (P1, P2, P3) con agregación, features, partición temporal, entrenamiento y evaluación, y todos registran en MLflow">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="2080" height="712" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1f2933">
<text x="30" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">FUENTE</text>
<text x="270" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">LIMPIEZA COMÚN</text>
<text x="560" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">AGREGACIÓN Y ETIQUETA</text>
<text x="814" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">FEATURES</text>
<text x="1068" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">PARTICIÓN</text>
<text x="1322" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">ENTRENAMIENTO</text>
<text x="1576" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">EVALUACIÓN</text>
<text x="1850" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">REGISTRO</text>
<text x="560" y="84" font-size="14" font-weight="700">P1 · Regresión: viajes que inician en una estación, por hora (próximas 24 h)</text>
<rect x="560" y="96" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="574" y="122" font-size="14.5" font-weight="700">Viajes por estación-hora</text>
<text x="574" y="148" font-size="12.5" fill="#1f2933">Cuenta por origen_id y hora</text>
<text x="574" y="169" font-size="12.5" fill="#0b7a6b" font-weight="600">Ceros desde la 1ª hora activa</text>
<text x="574" y="190" font-size="12.5" fill="#1f2933">de cada estación</text>
<line x1="792" y1="171" x2="812" y2="171" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="814" y="96" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="828" y="122" font-size="14.5" font-weight="700">Calendario y rezagos</text>
<text x="828" y="148" font-size="12.5" fill="#1f2933">hora (sen/cos), día, festivo</text>
<text x="828" y="169" font-size="12.5" fill="#0b7a6b" font-weight="600">rezagos ≥ 24 h, media 7 d</text>
<text x="828" y="190" font-size="12.5" fill="#1f2933">capacidad, ubicación, pandemia</text>
<line x1="1046" y1="171" x2="1066" y2="171" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1068" y="96" width="230" height="150" rx="6" fill="#e2f2ef" stroke="#0b7a6b" stroke-width="1.6"/>
<text x="1082" y="122" font-size="14.5" font-weight="700">Temporal, sin mezclar</text>
<text x="1082" y="148" font-size="12.5" fill="#1f2933">Train 2020-01 a 2024-09</text>
<text x="1082" y="169" font-size="12.5" fill="#1f2933">Valid y test: 12 meses c/u</text>
<text x="1082" y="190" font-size="12.5" fill="#0b7a6b" font-weight="600">Brecha de 24 h entre bloques</text>
<line x1="1300" y1="171" x2="1320" y2="171" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1322" y="96" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="1336" y="122" font-size="14.5" font-weight="700">Baseline → candidatos</text>
<text x="1336" y="148" font-size="12.5" fill="#1f2933">Media por estación-hora-día</text>
<text x="1336" y="169" font-size="12.5" fill="#1f2933">Ridge</text>
<text x="1336" y="190" font-size="12.5" fill="#1f2933">XGBoost (objetivo Poisson)</text>
<line x1="1554" y1="171" x2="1574" y2="171" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1576" y="96" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="1590" y="122" font-size="14.5" font-weight="700">MAE y RMSE</text>
<text x="1590" y="148" font-size="12.5" fill="#1f2933">Contra el baseline</text>
<text x="1590" y="169" font-size="12.5" fill="#1f2933">Error por estación y hora</text>
<text x="1590" y="190" font-size="12.5" fill="#1f2933">Test se usa una sola vez</text>
<text x="560" y="292" font-size="14" font-weight="700">P2 · Clasificación: riesgo de quedarse sin bicis o sin anclajes (próximas 2 h)</text>
<rect x="560" y="304" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="574" y="330" font-size="14.5" font-weight="700">Neto acumulado del día</text>
<text x="574" y="356" font-size="12.5" fill="#1f2933">llegadas − salidas por hora</text>
<text x="574" y="377" font-size="12.5" fill="#1f2933">Etiqueta: riesgo en (t, t+2 h)</text>
<text x="574" y="398" font-size="12.5" fill="#1f2933">si |neto| ≥ u · capacidad</text>
<line x1="792" y1="379" x2="812" y2="379" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="814" y="304" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="828" y="330" font-size="14.5" font-weight="700">Presión de desbalance</text>
<text x="828" y="356" font-size="12.5" fill="#1f2933">neto 1 h, 2 h, 3 h</text>
<text x="828" y="377" font-size="12.5" fill="#1f2933">neto / capacidad</text>
<text x="828" y="398" font-size="12.5" fill="#0b7a6b" font-weight="600">solo datos hasta t</text>
<line x1="1046" y1="379" x2="1066" y2="379" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1068" y="304" width="230" height="150" rx="6" fill="#e2f2ef" stroke="#0b7a6b" stroke-width="1.6"/>
<text x="1082" y="330" font-size="14.5" font-weight="700">Temporal, sin mezclar</text>
<text x="1082" y="356" font-size="12.5" fill="#1f2933">Mismos bloques que P1</text>
<text x="1082" y="377" font-size="12.5" fill="#1f2933">Sin 4 est. con capacidad 0</text>
<text x="1082" y="398" font-size="12.5" fill="#0b7a6b" font-weight="600">Brecha de 2 h entre bloques</text>
<line x1="1300" y1="379" x2="1320" y2="379" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1322" y="304" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="1336" y="330" font-size="14.5" font-weight="700">Regla → candidatos</text>
<text x="1336" y="356" font-size="12.5" fill="#1f2933">Regla por umbral (operador)</text>
<text x="1336" y="377" font-size="12.5" fill="#1f2933">Regresión logística</text>
<text x="1336" y="398" font-size="12.5" fill="#1f2933">XGBoost con pesos de clase</text>
<line x1="1554" y1="379" x2="1574" y2="379" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1576" y="304" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="1590" y="330" font-size="14.5" font-weight="700">PR-AUC y recall</text>
<text x="1590" y="356" font-size="12.5" fill="#1f2933">Precisión mínima acordada</text>
<text x="1590" y="377" font-size="12.5" fill="#1f2933">Umbral elegido en valid</text>
<text x="1590" y="398" font-size="12.5" fill="#1f2933">por costo de la alerta</text>
<text x="560" y="500" font-size="14" font-weight="700">P3 · Clustering: grupos de estaciones con patrones de uso (sin horizonte)</text>
<rect x="560" y="512" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="574" y="538" font-size="14.5" font-weight="700">Una fila por estación</text>
<text x="574" y="564" font-size="12.5" fill="#1f2933">Perfil horario: 24 laboral</text>
<text x="574" y="585" font-size="12.5" fill="#1f2933">+ 24 fin de semana</text>
<text x="574" y="606" font-size="12.5" fill="#1f2933">volumen, razón salidas/llegadas</text>
<line x1="792" y1="587" x2="812" y2="587" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="814" y="512" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="828" y="538" font-size="14.5" font-weight="700">Perfil de uso</text>
<text x="828" y="564" font-size="12.5" fill="#1f2933">viajes circulares, duración</text>
<text x="828" y="585" font-size="12.5" fill="#1f2933">Se estandariza y filtra</text>
<text x="828" y="606" font-size="12.5" fill="#1f2933">lat/lon NO entran al cluster</text>
<line x1="1046" y1="587" x2="1066" y2="587" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1068" y="512" width="230" height="150" rx="6" fill="#e2f2ef" stroke="#0b7a6b" stroke-width="1.6"/>
<text x="1082" y="538" font-size="14.5" font-weight="700">Ajuste solo con train</text>
<text x="1082" y="564" font-size="12.5" fill="#0b7a6b" font-weight="600">Todo se calcula con 2020-2024</text>
<text x="1082" y="585" font-size="12.5" fill="#1f2933">Se revalida con el año</text>
<text x="1082" y="606" font-size="12.5" fill="#1f2933">de validación</text>
<line x1="1300" y1="587" x2="1320" y2="587" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1322" y="512" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="1336" y="538" font-size="14.5" font-weight="700">K-Means → HDBSCAN</text>
<text x="1336" y="564" font-size="12.5" fill="#1f2933">Elegir k por silueta</text>
<text x="1336" y="585" font-size="12.5" fill="#1f2933">PCA opcional</text>
<text x="1336" y="606" font-size="12.5" fill="#1f2933">Interpretar cada grupo</text>
<line x1="1554" y1="587" x2="1574" y2="587" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1576" y="512" width="230" height="150" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="1590" y="538" font-size="14.5" font-weight="700">Silueta y estabilidad</text>
<text x="1590" y="564" font-size="12.5" fill="#1f2933">ARI entre train y valid</text>
<text x="1590" y="585" font-size="12.5" fill="#1f2933">Perfil medio por grupo</text>
<text x="1590" y="606" font-size="12.5" fill="#1f2933">Mapa de estaciones</text>
<rect x="30" y="268" width="200" height="80" rx="6" fill="#ffffff" stroke="#5b6770" stroke-width="1.2"/>
<text x="44" y="294" font-size="14.5" font-weight="700">Viajes mensuales</text>
<text x="44" y="320" font-size="12.5" fill="#1f2933">datos_abiertos_AAAA_MM.csv</text>
<text x="44" y="341" font-size="12.5" fill="#1f2933">79 meses · 26.4 M</text>
<rect x="30" y="364" width="200" height="80" rx="6" fill="#ffffff" stroke="#5b6770" stroke-width="1.2"/>
<text x="44" y="390" font-size="14.5" font-weight="700">Estaciones</text>
<text x="44" y="416" font-size="12.5" fill="#1f2933">nomenclatura_2026_09.csv</text>
<text x="44" y="437" font-size="12.5" fill="#1f2933">484 estaciones</text>
<line x1="232" y1="308" x2="268" y2="330" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="232" y1="404" x2="268" y2="430" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="270" y="190" width="230" height="380" rx="6" fill="#f6f7f8" stroke="#5b6770" stroke-width="1.2"/>
<text x="284" y="216" font-size="14.5" font-weight="700">Limpieza común</text>
<text x="284" y="242" font-size="12.5" fill="#1f2933">Se eliminan:</text>
<text x="284" y="263" font-size="12.5" fill="#1f2933">  758 viajes duplicados</text>
<text x="284" y="284" font-size="12.5" fill="#1f2933">  3 estaciones sin nomenclatura</text>
<text x="284" y="305" font-size="12.5" fill="#1f2933">  53,581 viajes de duración 0</text>
<text x="284" y="326" font-size="12.5" fill="#1f2933">  (sensibilidad por probar)</text>
<text x="284" y="347" font-size="12.5" fill="#1f2933"></text>
<text x="284" y="368" font-size="12.5" fill="#1f2933">Se descartan (privacidad):</text>
<text x="284" y="389" font-size="12.5" fill="#1f2933">  usuario_id, género, año nac.</text>
<text x="284" y="410" font-size="12.5" fill="#1f2933"></text>
<text x="284" y="431" font-size="12.5" fill="#1f2933">Se conserva el hueco de</text>
<text x="284" y="452" font-size="12.5" fill="#1f2933">2023-04 y 2023-05 (sin imputar)</text>
<text x="284" y="473" font-size="12.5" fill="#1f2933"></text>
<text x="284" y="494" font-size="12.5" fill="#0b7a6b" font-weight="600">→ Parquet en data/interim</text>
<line x1="502" y1="380" x2="532" y2="380" stroke="#7b8794" stroke-width="1.6"/>
<line x1="532" y1="171" x2="532" y2="587" stroke="#7b8794" stroke-width="1.6"/>
<line x1="532" y1="171" x2="558" y2="171" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="532" y1="379" x2="558" y2="379" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="532" y1="587" x2="558" y2="587" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1850" y="96" width="200" height="566" rx="6" fill="#ffffff" stroke="#5b6770" stroke-width="1.2"/>
<text x="1864" y="122" font-size="14.5" font-weight="700">MLflow Tracking</text>
<text x="1864" y="148" font-size="12.5" fill="#1f2933">Un run por pregunta</text>
<text x="1864" y="169" font-size="12.5" fill="#1f2933"></text>
<text x="1864" y="190" font-size="12.5" fill="#1f2933">params: rango, semilla,</text>
<text x="1864" y="211" font-size="12.5" fill="#1f2933">  horizonte, umbral u</text>
<text x="1864" y="232" font-size="12.5" fill="#1f2933">métricas por conjunto</text>
<text x="1864" y="253" font-size="12.5" fill="#1f2933">tags: equipo, P1-P3,</text>
<text x="1864" y="274" font-size="12.5" fill="#1f2933">  commit de Git</text>
<text x="1864" y="295" font-size="12.5" fill="#1f2933">artefactos: gráficas,</text>
<text x="1864" y="316" font-size="12.5" fill="#1f2933">  mapa de grupos</text>
<text x="1864" y="337" font-size="12.5" fill="#1f2933"></text>
<text x="1864" y="358" font-size="12.5" fill="#0b7a6b" font-weight="600">data_version =</text>
<text x="1864" y="379" font-size="12.5" fill="#0b7a6b" font-weight="600">hash del manifiesto</text>
<text x="1864" y="400" font-size="12.5" fill="#1f2933"></text>
<text x="1864" y="421" font-size="12.5" fill="#1f2933">Mismos datos, mismo</text>
<text x="1864" y="442" font-size="12.5" fill="#1f2933">hash en cada run</text>
<line x1="1808" y1="171" x2="1848" y2="171" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1808" y1="379" x2="1848" y2="379" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1808" y1="587" x2="1848" y2="587" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="30" y="694" font-size="12" fill="#5b6770">Verde: controles contra fuga de información del futuro (rezagos con corte, brechas entre bloques y ajuste solo con entrenamiento).</text>
</g></svg>