[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "MLOps-ProyectoMiBici-Equipo7"
version = "0.0.1"
description = "Proyecto Mi Bici del equipo 7"
authors = [
  { name = "Equipo 7 - MLOps - TC5061" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["MLOps-ProyectoMiBici-Equipo7"]
include = ["pyproject.toml", "MLOps-ProyectoMiBici-Equipo7/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["MLOps-ProyectoMiBici-Equipo7"]
force-sort-within-sections = true

